<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 180" role="img" aria-labelledby="title desc">
  <title id="title">Logo Entreprise</title>
  <desc id="desc">Emblème d'entreprise moderne et épuré avec typographie bilingue.</desc>
  <style>
    .ink-dark { fill: #0f172a; }
    .ink-muted { fill: #475569; }
    .ink-accent { fill: #1e40af; }
    .fr-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .fr-sub {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .ar-title {
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      font-size: 26px;
      font-weight: 700;
    }
  </style>

  <g transform="translate(24, 30)">
    <rect width="120" height="120" rx="28" fill="#1e40af"/>
    <path d="M38 84V36H82M38 60H74" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="82" cy="84" r="8" fill="#60a5fa"/>
  </g>

  <!-- French Text -->
  <text class="fr-title ink-dark" x="170" y="82">ENTREPRISE</text>
  <text class="fr-sub ink-muted" x="170" y="112">Gestion &amp; Commerce</text>

  <!-- Arabic Text -->
  <text class="ar-title ink-dark" x="496" y="86" text-anchor="end">الشركة التجارية</text>
  <text class="ink-muted" x="496" y="112" text-anchor="end" font-size="14" font-family="sans-serif">نظام التسيير التجاري</text>
</svg>
